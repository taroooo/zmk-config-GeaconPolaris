---
include:
# Left Shields
  - board: seeeduino_xiao_ble
    shield: Polaris_L_Base rgbled_adapter nice_oled
    snippet: LPPS zmk-usb-logging
    artifact-name: Polaris_L_MODULE_LPPS

  - board: seeeduino_xiao_ble
    shield: Polaris_L_Base rgbled_adapter nice_oled
    snippet: TB_L zmk-usb-logging studio-rpc-usb-uart
    artifact-name: Polaris_L_MODULE_TB

  - board: seeeduino_xiao_ble
    shield: Polaris_L_Base rgbled_adapter nice_oled
    snippet: JOY battery-voltage-divider-oversampling zmk-usb-logging studio-rpc-usb-uart
    artifact-name: Polaris_L_MODULE_JOY

  # Diagnostic builds for the right-half connection freeze. These are kept on
  # the diagnostic branch only and are not intended for normal releases.
  - board: seeeduino_xiao_ble
    shield: Polaris_L_Base rgbled_adapter nice_oled
    snippet: JOY battery-voltage-divider-oversampling zmk-usb-logging studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_RUNTIME_COMBO=n
    artifact-name: Polaris_L_MODULE_JOY_DIAG_NO_RUNTIME_COMBO

  - board: seeeduino_xiao_ble
    shield: Polaris_L_Base rgbled_adapter nice_oled
    snippet: JOY battery-voltage-divider-oversampling zmk-usb-logging studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_RUNTIME_COMBO_STUDIO_RPC=n
    artifact-name: Polaris_L_MODULE_JOY_DIAG_NO_COMBO_RPC

  - board: seeeduino_xiao_ble
    shield: Polaris_L_Base rgbled_adapter nice_oled
    snippet: JOY battery-voltage-divider-oversampling zmk-usb-logging studio-rpc-usb-uart runtime-combo-no-defaults
    artifact-name: Polaris_L_MODULE_JOY_DIAG_NO_COMBO_DEFAULTS

  - board: seeeduino_xiao_ble
    shield: Polaris_L_Base rgbled_adapter nice_oled
    snippet: ENC zmk-usb-logging studio-rpc-usb-uart
    artifact-name: Polaris_L_MODULE_ENC

  - board: seeeduino_xiao_ble
    shield: Polaris_L_Base rgbled_adapter nice_oled
    snippet: TPD_L zmk-usb-logging studio-rpc-usb-uart
    artifact-name: Polaris_L_MODULE_TPD

# Right Shields
  - board: seeeduino_xiao_ble
    shield: Polaris_R_Base rgbled_adapter
    snippet: TB_R zmk-usb-logging studio-rpc-usb-uart
    artifact-name: Polaris_R_MODULE_TB

  - board: seeeduino_xiao_ble
    shield: Polaris_R_Base rgbled_adapter
    snippet: TPD_R zmk-usb-logging studio-rpc-usb-uart
    artifact-name: Polaris_R_MODULE_TPD

  - board: seeeduino_xiao_ble
    shield: Polaris_R_Base rgbled_adapter
    snippet: IQS zmk-usb-logging studio-rpc-usb-uart
    artifact-name: Polaris_R_MODULE_IQS

# Settings Reset
  - board: seeeduino_xiao_ble
    shield: settings_reset
